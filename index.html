<script type="module">
'use strict';
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getFirestore, collection, doc, setDoc, updateDoc, getDoc, onSnapshot, query, orderBy, limit, arrayUnion } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBiO3RXjpMJwp-iTKWZmgY0SATtQ_m9Se8",
  authDomain: "enp-trunggianpassve-a9562.firebaseapp.com",
  projectId: "enp-trunggianpassve-a9562",
  storageBucket: "enp-trunggianpassve-a9562.firebasestorage.app",
  messagingSenderId: "762270281318",
  appId: "1:762270281318:web:c1724bde29d61bb3be87a7",
  measurementId: "G-Z3B8QQFN26"
};
const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const dbFs = getFirestore(fbApp);

const $=(s,r)=>(r||document).querySelector(s);
const $all=(s,r)=>[...(r||document).querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>Math.round(n||0).toLocaleString('vi-VN')+'đ';
const pad=n=>String(n).padStart(2,'0');
const rid=(p)=>(p||'')+Math.random().toString(36).slice(2,7).toUpperCase();

/* ================= SETTINGS & CONSTANTS ================= */
const settings={ feePercent:2, fixedFee:3000, partnerFeePercent:0.6, autoCompleteHours:48, reviewHours:2, ackDays:'', apiKey:'pk_live_mm_7f2a...e91c', apiSecret:'••••••••••••••••' };
const ADMIN_PASSCODE='ADMIN2026';
const SUPPORT_EMAIL='support@ben10.vn';
const COMPLAINT_CATS=['Thanh toán','Không nhận được vé','Sai thông tin vé','Vé không đủ điều kiện chuyển giao','Nghi ngờ gian lận','Dữ liệu cá nhân','Khác'];
const REFUND_POLICY='Nếu người bán gỡ tin sau khi bạn đã thanh toán, hoặc khiếu nại của bạn được xử thắng, tiền được hoàn về đúng tài khoản ngân hàng bạn đã đăng ký. Tiền chỉ được giải ngân cho người bán khi bạn xác nhận đã nhận vé hoặc hết thời gian kiểm vé mà không có khiếu nại.';

const STATUS = {
  CREATED:{label:'Khởi tạo',color:'navy'},
  WAITING_PAYMENT:{label:'Chờ thanh toán',color:'amber'},
  HOLDING_BY_PARTNER:{label:'Đối tác đã giữ tiền',color:'mint'},
  DELIVERED:{label:'Người bán đã giao vé',color:'sky'},
  COMPLETED:{label:'Hoàn tất',color:'mint'},
  DISPUTED:{label:'Đang khiếu nại',color:'red'},
  REFUNDED:{label:'Đã hoàn tiền',color:'slate'},
  CANCELLED:{label:'Đã gỡ tin',color:'slate'}
};
const BADGE = {navy:'bg-navy-100 text-navy-700',amber:'bg-amber-100 text-amber-700',mint:'bg-mint-100 text-mint-700',sky:'bg-sky-100 text-sky-700',red:'bg-red-100 text-red-700',slate:'bg-slate-200 text-slate-600'};

function computeFees(amount,feePayer){
  const platformFee=Math.round(amount*settings.feePercent/100);
  const partnerFee=Math.round(amount*settings.partnerFeePercent/100)+settings.fixedFee;
  const feeTotal=platformFee+partnerFee;
  let buyerTotal=amount, sellerReceive=amount;
  if(feePayer==='BUYER'){ buyerTotal=amount+feeTotal; sellerReceive=amount; }
  else if(feePayer==='SELLER'){ buyerTotal=amount; sellerReceive=amount-feeTotal; }
  else { buyerTotal=amount+Math.round(feeTotal/2); sellerReceive=amount-Math.ceil(feeTotal/2); }
  return {platformFee,partnerFee,feeTotal,buyerTotal,sellerReceive};
}

/* ================= DATA LAYER (Firebase: Auth ẩn danh + Firestore) ================= */
let myId=null, mySellerPayout=null, myBuyerBank=null, booted=false;
const maskAcct=no=>{ const d=(no||'').replace(/\s+/g,''); return d.length<=4?d:'••••'+d.slice(-4); };
const fakeHolderName=n=>{ const s=(n||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').trim().toUpperCase(); return s||'NGUYEN VAN A'; };
async function hashAcct(bank,no){
  const s=(bank||'').trim().toLowerCase()+'|'+(no||'').replace(/\s+/g,'');
  try{ if(window.crypto&&crypto.subtle){ const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)); return [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('').slice(0,24); } }catch(e){}
  let x=5381; for(const c of s) x=((x<<5)+x+c.charCodeAt(0))|0; return 'x'+(x>>>0).toString(16);
}
function acctFields(side,b){ return {[side+'BankName']:b.bank,[side+'AcctMasked']:maskAcct(b.no),[side+'AcctNo']:b.no,[side+'AcctName']:b.name,[side+'AcctHash']:b.hash,[side+'Phone']:b.phone||''}; }
let orders=[], webhookLog=[]; let seq=1000;
let writeChains=Object.create(null);

function persistOrder(o,patch){
  const id=o.id, prev=writeChains[id]||Promise.resolve();
  writeChains[id]=prev.then(()=>updateDoc(doc(dbFs,'orders',id),patch)).catch(e=>console.error('order update failed',e));
}
function persistNewOrder(o){
  setDoc(doc(dbFs,'orders',o.id), o).catch(e=>console.error('order create failed',e));
}
function persistLog(entry){
  setDoc(doc(dbFs,'webhooklog',entry.id), entry).catch(e=>console.error('log write failed',e));
}
function persistBuyerBank(b){
  if(!myId) return;
  setDoc(doc(dbFs,'users',myId,'private','buyerbank'), b).catch(e=>console.error('buyer bank save failed',e));
}
function persistPayout(payout){
  if(!myId) return;
  setDoc(doc(dbFs,'users',myId,'private','payout'), payout).catch(e=>console.error('payout save failed',e));
}
function logEvent(orderId,partner,type,status,payload,fixedId){
  const entry={id:fixedId||('EVT'+(++seq)+'-'+rid()),orderId,partner,type,status,ts:Date.now(),sig:true,payload:JSON.parse(JSON.stringify(payload||{}))};
  webhookLog.unshift(entry); persistLog(entry);
}
function buildOrder(d){
  const o=Object.assign({
    id:rid('OD-'), roomCode:rid(''), roomPassword:null,
    buyerUserId:null, sellerUserId:null, buyerName:'', sellerName:'',
    itemName:'', tier:'', qty:1, description:'', amount:0, feePayer:'BUYER',
    inspectionHours:24, status:'CREATED', createdAt:Date.now(), messages:[], evidences:[],
    buyerBankName:null, buyerAcctMasked:null, buyerAcctName:null, buyerAcctHash:null,
    sellerBankName:null, sellerAcctMasked:null, sellerAcctName:null, sellerAcctHash:null,
    buyerAcctNo:null, sellerAcctNo:null, buyerPhone:'', sellerPhone:'',
    adminMsgs:{buyer:[],seller:[]}, calls:{buyer:[],seller:[]},
    eventAt:null, issuer:'', transferRestrictions:'', eligibilityConfirmedAt:null, review:null,
    buyerConfirmedAt:null, complaint:null, disputeBy:null, resolution:null, appeal:null, escalation:null, cancel:null, autoCompletedAt:null,
    paidAt:null, deliveredAt:null, completedAt:null, refundedAt:null, partnerTxId:null,
    disputeReason:'', disputeEvidence:[],
    hearing:null, platformCheckNotes:'', platformCheckAt:null
  },d);
  if(!o.roomPassword) o.roomPassword=String(Math.floor(1000+Math.random()*9000));
  const f=computeFees(o.amount,o.feePayer); Object.assign(o,f);
  return o;
}
function joinRoom(code,pass,role,displayName){
  const o=orders.find(x=>x.roomCode===(code||'').trim().toUpperCase());
  if(!o) return {ok:false,msg:'Không tìm thấy phòng với mã này.'};
  if((joinFails[o.roomCode]||{}).lockUntil>Date.now()) return {ok:false,msg:'Nhập sai mật khẩu quá nhiều lần — phòng tạm khoá 5 phút.'};
  if((o.roomPassword||'').toLowerCase()!==(pass||'').trim().toLowerCase()){ const f=joinFails[o.roomCode]=joinFails[o.roomCode]||{n:0,lockUntil:0}; if(++f.n>=5){ f.n=0; f.lockUntil=Date.now()+300000; } return {ok:false,msg:'Mật khẩu không khớp với mã phòng này — kiểm tra lại với đối tác giao dịch.'}; }
  if(!myId) return {ok:false,msg:'Đang kết nối tài khoản, thử lại sau vài giây.'};
  if(role==='buyer'){
    if(o.status==='CANCELLED') return {ok:false,msg:'Tin này đã được gỡ hoặc bị từ chối — không thể tham gia.'};
    if(o.review&&o.review.status==='PENDING') return {ok:false,msg:'Tin này đang chờ PassTic xác minh (dự kiến trong '+settings.reviewHours+' giờ) — vui lòng thử lại sau.'};
    if(o.review&&o.review.status==='REJECTED') return {ok:false,msg:'Tin này đã bị PassTic từ chối.'};
    if(!myBuyerBank||!myBuyerBank.hash) return {ok:false,msg:'Bạn cần đăng ký tài khoản ngân hàng trước khi vào phòng.'};
    if(o.sellerUserId===myId) return {ok:false,msg:'Tài khoản của bạn đang là người bán của phòng này — không thể đồng thời là người mua.'};
    if(o.buyerUserId && o.buyerUserId!==myId) return {ok:false,msg:'Phòng đã đủ 2 thành viên và đã khoá — không thể tham gia thêm.'};
    if(o.sellerAcctHash && o.sellerAcctHash===myBuyerBank.hash) return {ok:false,msg:'Tài khoản ngân hàng của bạn trùng với tài khoản của người bán — giao dịch bị chặn để phòng rửa tiền.'};
    o.buyerUserId=myId; if(displayName) o.buyerName=displayName;
    const bf=acctFields('buyer',myBuyerBank); Object.assign(o,bf);
    const joinPatch=Object.assign({buyerUserId:myId,buyerName:o.buyerName},bf);
    if(o.status==='CREATED'){ o.status='WAITING_PAYMENT'; joinPatch.status=o.status; }
    persistOrder(o,joinPatch);
  } else {
    if(!mySellerPayout||!mySellerPayout.hash) return {ok:false,msg:'Bạn cần đăng ký tài khoản ngân hàng nhận tiền trước.'};
    if(o.buyerUserId===myId) return {ok:false,msg:'Tài khoản của bạn đang là người mua của phòng này — không thể đồng thời là người bán.'};
    if(o.sellerUserId && o.sellerUserId!==myId) return {ok:false,msg:'Phòng đã đủ 2 thành viên và đã khoá — không thể tham gia thêm.'};
    if(o.buyerAcctHash && o.buyerAcctHash===mySellerPayout.hash) return {ok:false,msg:'Tài khoản ngân hàng của bạn trùng với tài khoản của người mua — giao dịch bị chặn để phòng rửa tiền.'};
    o.sellerUserId=myId; if(displayName) o.sellerName=displayName;
    const sf=acctFields('seller',mySellerPayout); Object.assign(o,sf);
    persistOrder(o,Object.assign({sellerUserId:myId,sellerName:o.sellerName},sf));
  }
  return {ok:true,order:o};
}
function orderOf(id){ return orders.find(o=>o.id===id); }
function settleDispute(o, winner, reason, basis){
  const at=Date.now(); const patch={};
  o.resolution={winner,reason,basis:basis||'',at}; patch.resolution=o.resolution;
  if(o.hearing){ o.hearing.verdict=winner; o.hearing.verdictReason=reason; o.hearing.verdictAt=at;
    patch['hearing.verdict']=winner; patch['hearing.verdictReason']=reason; patch['hearing.verdictAt']=at; }
  if(winner==='buyer'){
    o.status='REFUNDED'; o.refundedAt=at; patch.status=o.status; patch.refundedAt=at;
    persistOrder(o,patch);
    logEvent(o.id,'MOMO','REFUND','SUCCESS',{amount:o.buyerTotal,idk:'IDK-'+rid(),acct:o.buyerAcctMasked?('Đến '+o.buyerAcctMasked):undefined});
    toast(reason==='no_show'?'Người bán vắng mặt quá hạn — đã hoàn tiền cho người mua':'Đã xử người mua thắng — hoàn tiền 100%');
  } else {
    o.status='COMPLETED'; o.completedAt=at; patch.status=o.status; patch.completedAt=at;
    persistOrder(o,patch);
    logEvent(o.id,'MOMO','PAYOUT','SUCCESS',{amount:o.sellerReceive,idk:'IDK-'+rid(),acct:o.sellerAcctMasked?('Đến '+o.sellerAcctMasked):undefined});
    toast(reason==='no_show'?'Người mua vắng mặt quá hạn — đã giải ngân cho người bán':'Đã xử người bán thắng — giải ngân');
  }
  render();
}
function maybeAutoResolve(o){
  if(!o||!o.hearing||o.hearing.verdict||o.status!=='DISPUTED'||o.escalation) return;
  const {buyerJoined,sellerJoined}=o.hearing;
  if(buyerJoined===sellerJoined) return;
  settleDispute(o, buyerJoined?'buyer':'seller', 'no_show', buyerJoined?'Người bán không tham gia phiên đối chất đúng hạn nên người mua được xử thắng.':'Người mua không tham gia phiên đối chất đúng hạn nên người bán được xử thắng.');
}
function adminNotify(o,side,text){
  const msg={from:'admin',text,ts:Date.now()};
  if(!o.adminMsgs) o.adminMsgs={buyer:[],seller:[]};
  o.adminMsgs[side]=[...(o.adminMsgs[side]||[]),msg];
  persistOrder(o,{['adminMsgs.'+side]:arrayUnion(msg)});
}
function autoCompleteIfDue(o){
  if(!o||o.status!=='DELIVERED'||!o.deliveredAt||o.autoCompletedAt) return false;
  if(Date.now()<o.deliveredAt+o.inspectionHours*3600*1000) return false;
  const at=Date.now();
  o.status='COMPLETED'; o.completedAt=at; o.autoCompletedAt=at;
  persistOrder(o,{status:o.status,completedAt:at,autoCompletedAt:at});
  logEvent(o.id,'MOMO','PAYOUT','SUCCESS',{amount:o.sellerReceive,idk:'IDK-AUTO-'+o.id,acct:(o.sellerAcctMasked?('Đến '+o.sellerAcctMasked+' · '):'')+'tự động sau thời gian kiểm vé'},'AUTO-'+o.id);
  toast('Hết thời gian kiểm vé — đã tự động giải ngân cho người bán');
  return true;
}
function autoReview(o){
  const reasons=[];
  if(/(cấm|không\s*(được\s*)?(chuyển|nhượng|bán lại|tặng))/i.test(o.transferRestrictions||'')) reasons.push('Mục "hạn chế chuyển giao" có dấu hiệu mâu thuẫn với xác nhận vé được phép chuyển giao.');
  riskFlags(o).filter(f=>f.lv==='high').forEach(f=>reasons.push(f.t));
  return {status:reasons.length?'PENDING':'APPROVED',reasons,checkedAt:Date.now(),by:'auto'};
}
function myOrders(role){
  const mine=role==='buyer'?orders.filter(o=>o.buyerUserId===myId):orders.filter(o=>o.sellerUserId===myId);
  return mine.sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
}

async function boot(){
  await new Promise(resolve=>{
    onAuthStateChanged(auth, async (user)=>{
      if(user){ myId=user.uid; resolve(); return; }
      try{ const cred=await signInAnonymously(auth); myId=cred.user.uid; }
      catch(e){ console.error('đăng nhập ẩn danh thất bại',e); myId=null; }
      resolve();
    });
  });

  onSnapshot(collection(dbFs,'orders'), snap=>{
    orders = snap.docs.map(d=>({id:d.id, ...d.data()})); diffNotify(orders);
    orders.forEach(o=>{ if(myId&&(o.buyerUserId===myId||o.sellerUserId===myId||state.role==='admin')) autoCompleteIfDue(o); });
    if(booted) render();
  }, e=>console.error('orders snapshot error',e));

  onSnapshot(query(collection(dbFs,'webhooklog'), orderBy('ts','desc'), limit(50)), snap=>{
    webhookLog = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(booted) render();
  }, e=>console.error('log snapshot error',e));

  if(myId){
    try{ const p=await getDoc(doc(dbFs,'users',myId,'private','payout')); if(p.exists()) mySellerPayout=p.data(); }catch(e){}
    try{ const b=await getDoc(doc(dbFs,'users',myId,'private','buyerbank')); if(b.exists()) myBuyerBank=b.data(); }catch(e){}
  }
  booted=true; console.log('PassTic v9');
  const sb=$('#syncBadge');
  if(sb) sb.textContent = myId ? 'Đồng bộ trực tiếp qua Firebase — bạn và đối tác giao dịch dùng chung dữ liệu' : 'Không kết nối được Firebase — thử tải lại trang';
  render();
}

function toast(msg,kind){
  const el=document.createElement('div');
  el.className='fade px-4 py-2.5 rounded-xl shadow-card text-sm font-semibold text-white '+(kind==='err'?'bg-red-600':kind==='warn'?'bg-amber-600':'bg-navy-800');
  el.textContent=msg; $('#toastRoot').appendChild(el); setTimeout(()=>el.remove(),3200);
}

function compressImg(file,max=720,q=.6){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onerror=rej; r.onload=()=>{ const im=new Image(); im.onerror=rej; im.onload=()=>{ const k=Math.min(1,max/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); res(c.toDataURL('image/jpeg',q)); }; im.src=r.result; }; r.readAsDataURL(file); }); }

let notifs=[], prevOrders=null, unread=0;
function updateBell(){ const b=$('#bellN'); if(b){ b.textContent=unread; b.classList.toggle('hidden',!unread); } document.title=(unread?'('+unread+') ':'')+'PassTic — Giao dịch ký quỹ cho vé concert'; }
function pushN(t){ notifs.unshift({t,ts:Date.now()}); unread++; updateBell(); toast('🔔 '+t); try{ if(window.Notification&&Notification.permission==='granted'&&document.hidden) new Notification('PassTic',{body:t}); }catch(e){} }
function diffNotify(next){
  if(!prevOrders){ prevOrders=Object.fromEntries(next.map(o=>[o.id,o])); return; }
  next.forEach(o=>{
    const p=prevOrders[o.id], isB=!!myId&&o.buyerUserId===myId, isS=!!myId&&o.sellerUserId===myId, adm=state.adminUnlocked, n=o.itemName;
    if(!p){ if(adm) pushN('Phòng mới: '+n); return; }
    if(isS&&!p.buyerUserId&&o.buyerUserId) pushN('Người mua đã vào phòng “'+n+'”.');
    if(p.status!==o.status){
      const st=o.status, own=o.complaint&&((o.complaint.by==='buyer'&&isB)||(o.complaint.by==='seller'&&isS));
      if(st==='HOLDING_BY_PARTNER'&&isS) pushN('Đã nhận ĐỦ tiền “'+n+'” — hãy chuyển vé qua tính năng chính thức.');
      if(st==='DELIVERED'&&isB) pushN('Người bán đã giao vé “'+n+'” — kiểm tra trong tài khoản vé rồi xác nhận hoặc khiếu nại.');
      if(st==='COMPLETED'&&isS) pushN('Giao dịch “'+n+'” hoàn tất — tiền đã giải ngân.');
      if(st==='DISPUTED'&&(isB||isS||adm)&&!own) pushN(adm?'Khiếu nại mới cần xử lý: '+n:'Giao dịch “'+n+'” đang bị khiếu nại.');
      if(st==='REFUNDED'&&(isB||isS)) pushN('Giao dịch “'+n+'” đã hoàn tiền.');
      if(st==='CANCELLED'&&isB) pushN('Người bán đã gỡ tin “'+n+'”.');
    }
    const pm=(p.messages||[]).length, nm=(o.messages||[]).length, last=(o.messages||[])[nm-1];
    if(nm>pm&&last&&((isB&&last.from==='seller')||(isS&&last.from==='buyer'))) pushN('Tin nhắn mới trong “'+n+'”.');
    const side=isB?'buyer':isS?'seller':null;
    ['buyer','seller'].forEach(sd=>{ const a=((p.adminMsgs||{})[sd]||[]).length, L=((o.adminMsgs||{})[sd]||[]), b=L.length;
      if(b>a){ if(side===sd&&L[b-1].from==='admin') pushN('Quản trị viên nhắn bạn trong “'+n+'”.'); if(adm&&L[b-1].from!=='admin') pushN((sd==='buyer'?'Người mua':'Người bán')+' trả lời trong “'+n+'”.'); } });
    if(adm&&o.review&&o.review.status==='PENDING'&&!(p.review&&p.review.status==='PENDING')) pushN('Tin chờ duyệt: '+n);
    if(isS&&o.review&&p.review&&p.review.status!==o.review.status&&o.review.status!=='PENDING') pushN('PassTic đã '+(o.review.status==='APPROVED'?'duyệt':'từ chối')+' tin “'+n+'”.');
    if(adm&&!p.appeal&&o.appeal) pushN('Có yêu cầu xem xét lại: '+n);
  });
  prevOrders=Object.fromEntries(next.map(o=>[o.id,o]));
}

  const o=orderOf(state.orderId); if(!o) return role==='buyer'?buyerHome():sellerHome();
  const steps=['CREATED','HOLDING_BY_PARTNER','DELIVERED','COMPLETED'];
  const idx=o.status==='DISPUTED'||o.status==='REFUNDED'||o.status==='CANCELLED' ? -1 : o.status==='COMPLETED' ? steps.length : steps.indexOf(o.status==='WAITING_PAYMENT'?'CREATED':o.status);
  const stepLabels=['Khởi tạo','Đối tác đã giữ tiền','Người bán đã giao vé','Hoàn tất / Giải ngân'];

  let banner='';
  if(role==='seller'){
    if(!o.buyerUserId && o.status==='CREATED') banner=`<div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 text-amber-800 text-sm font-bold px-4 py-3 mb-4">⏳ Chưa có người mua — hãy gửi mã phòng và mật khẩu (ở khung bên phải) cho người mua.</div>`;
    else if(o.status==='WAITING_PAYMENT'||o.status==='CREATED') banner=`<div class="rounded-xl bg-red-50 ring-1 ring-red-200 text-red-700 text-sm font-bold px-4 py-3 mb-4">⚠ Chưa nhận tiền — Tuyệt đối không giao vé cho người mua.</div>`;
    else if(o.status==='HOLDING_BY_PARTNER') banner=`<div class="rounded-xl bg-mint-50 ring-1 ring-mint-200 text-mint-700 text-sm font-bold px-4 py-3 mb-4">✓ Đối tác đã giữ ${money(o.buyerTotal)} — Hãy tiến hành gửi vé cho người mua.</div>`;
  }
  if(o.status==='DISPUTED') banner=`<div class="rounded-xl bg-red-50 ring-1 ring-red-200 text-red-700 text-sm font-bold px-4 py-3 mb-4">⚖ Giao dịch đang bị khiếu nại — mọi lệnh tự động đã bị khoá, chờ Quản trị viên phân xử.</div>`;
  if(o.status==='COMPLETED') banner=`<div class="rounded-xl bg-mint-50 ring-1 ring-mint-200 text-mint-700 text-sm font-bold px-4 py-3 mb-4">✓ Giao dịch hoàn tất. Tiền đã được giải ngân cho người bán.</div>`;
  if(o.status==='REFUNDED') banner=`<div class="rounded-xl bg-slate-100 ring-1 ring-slate-200 text-slate-600 text-sm font-bold px-4 py-3 mb-4">↩ Đã hoàn tiền 100% về người mua theo phán quyết Quản trị viên.</div>`;
  if(o.status==='CANCELLED') banner=`<div class="rounded-xl bg-slate-100 ring-1 ring-slate-200 text-slate-700 text-sm font-bold px-4 py-3 mb-4">⛔ Tin đã được gỡ${o.cancel&&o.cancel.reason?': '+esc(o.cancel.reason):''}${o.review&&o.review.status==='REJECTED'?' — PassTic từ chối tin: '+esc(o.review.reason||''):''}.</div>`;
  if(o.status==='REFUNDED'&&o.cancel) banner=`<div class="rounded-xl bg-slate-100 ring-1 ring-slate-200 text-slate-700 text-sm font-bold px-4 py-3 mb-4">↩ Người bán đã huỷ giao dịch trước khi bàn giao${o.cancel.reason?' ('+esc(o.cancel.reason)+')':''}. Tiền được hoàn về đúng tài khoản người mua đã đăng ký.</div>`;
  if(role==='seller'&&o.review&&(o.status==='CREATED'||o.status==='WAITING_PAYMENT')){
    const rv=o.review;
    if(rv.status==='PENDING') banner=`<div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 text-amber-800 text-sm font-bold px-4 py-3 mb-4">⏳ Tin đang chờ PassTic xác minh (thường trong ${settings.reviewHours} giờ, tính từ ${new Date(rv.checkedAt||Date.now()).toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})}) — người mua chưa vào được phòng.${(rv.reasons||[]).length?'<ul class="list-disc pl-5 mt-1 font-medium">'+rv.reasons.map(r=>'<li>'+esc(r)+'</li>').join('')+'</ul>':''}</div>`+banner;
    else if(rv.status==='APPROVED'&&!o.buyerUserId) banner=`<div class="rounded-xl bg-mint-50 ring-1 ring-mint-200 text-mint-700 text-sm font-semibold px-4 py-3 mb-4">✓ Tin đã qua kiểm tra của PassTic (tính đầy đủ và dấu hiệu rủi ro). Đây không phải xác nhận của Ticketbox hay nhà phát hành vé.</div>`+banner;
  }

  if(role==='buyer'&&['HOLDING_BY_PARTNER','DELIVERED'].includes(o.status)) banner+=`<div class="rounded-xl bg-navy-800 text-white text-sm px-4 py-3 mb-4">🛡 <b>Vé hợp lệ = vé hiện trong tài khoản vé của CHÍNH BẠN.</b> Nếu người bán gửi ảnh QR / ảnh chụp màn hình / mã vé: đó chưa phải là chuyển giao — đừng xác nhận, hãy bấm “Báo vấn đề”.</div>`;
  if(role==='seller'&&o.status==='HOLDING_BY_PARTNER') banner+=`<div class="rounded-xl bg-amber-50 ring-1 ring-amber-200 text-amber-800 text-sm px-4 py-3 mb-4">Chỉ chuyển vé qua <b>tính năng chuyển/tặng chính thức</b>. Gửi ảnh QR bị coi là chưa giao vé và có thể bị xử thua tranh chấp.</div>`;
  let hearingBlock='';
  if(o.status==='DISPUTED' && o.hearing && !o.hearing.verdict){
    const mine = role==='buyer' ? o.hearing.buyerJoined : o.hearing.sellerJoined;
    hearingBlock = card(`<h3 class="font-extrabold mb-2">⚖ Phiên đối chất với Quản trị viên</h3>
      <p class="text-sm text-navy-400 mb-3">Quản trị viên đã mời cả hai bên vào một cuộc họp để trình bày. Nếu bạn không xác nhận tham gia trước hạn, bên còn lại có thể được xử thắng.</p>
      <a href="${esc(o.hearing.meetLink)}" target="_blank" rel="noopener" class="inline-flex items-center gap-2 rounded-xl bg-navy-800 text-white px-4 py-2.5 text-sm font-bold mb-3">🎥 Tham gia Google Meet</a>
      <div class="text-sm mb-3">Hạn chót tham gia: <b id="hearingTimer" class="font-mono"></b></div>
      ${mine?'<p class="text-sm font-semibold text-mint-700">✓ Bạn đã xác nhận tham gia.</p>':btn('✓ Tôi đã vào cuộc họp','data-act="joinHearing" data-id="'+o.id+'"')}
    `,'mb-4');
  }

  let adminBlock='';
  {
    const side=role==='buyer'?'buyer':'seller';
    const th=(o.adminMsgs&&o.adminMsgs[side])||[];
    const canReply=o.status==='DISPUTED'||!!(o.review&&o.review.status==='PENDING');
    if(canReply||th.length){
      adminBlock=card(`<h3 class="font-extrabold mb-1">💬 Tin nhắn từ Quản trị viên</h3>
        <p class="text-xs text-navy-400 mb-3">Chỉ bạn và Quản trị viên thấy cuộc trò chuyện này.</p>
        <div class="max-h-48 overflow-y-auto bg-navy-50 rounded-xl p-3 grid gap-2 content-start ${canReply?'mb-3':''}">${th.map(m=>`<div class="max-w-[85%] ${m.from===side?'ml-auto bg-mint-500 text-white':'bg-white ring-1 ring-navy-100'} rounded-xl px-3 py-2 text-sm">${esc(m.text)}</div>`).join('')||'<p class="text-xs text-navy-300 text-center py-4">Quản trị viên chưa nhắn tin cho bạn.</p>'}</div>
        ${canReply?`<div class="flex gap-2"><input id="rm-input" class="${inCls}" placeholder="Trả lời Quản trị viên…">${btn('Gửi','data-act="partySendAdmin" data-id="'+o.id+'"')}</div>`:''}`,'mb-4');
    }
  }

  let complaintBlock='';
  if(o.complaint&&o.status==='DISPUTED'){
    const c=o.complaint;
    complaintBlock=card(`<h3 class="font-extrabold mb-1">Khiếu nại ${esc(c.id)}</h3>
      <p class="text-sm text-navy-400">Loại: ${esc(c.category)} · gửi bởi ${c.by==='seller'?'người bán':'người mua'}</p>
      <p class="text-sm mt-1 font-semibold ${c.ackAt?'text-mint-700':'text-amber-700'}">${c.ackAt?'✓ PassTic đã tiếp nhận lúc '+new Date(c.ackAt).toLocaleString('vi-VN'):'Đã ghi nhận — đang chờ PassTic tiếp nhận.'}</p>
      <p class="text-xs text-navy-400 mt-2">Giao dịch được tạm khoá trong lúc xác minh. PassTic không bao giờ yêu cầu mật khẩu hoặc mã OTP.</p>`,'mb-4');
  }
  let resolutionBlock='';
  if(o.resolution){
    const r=o.resolution, ap=o.appeal;
    resolutionBlock=card(`<h3 class="font-extrabold mb-2">⚖ Kết quả xử lý khiếu nại</h3>
      <p class="font-bold">${resolutionLabel(r)}</p>
      <p class="text-sm mt-1"><b>Căn cứ &amp; hướng xử lý:</b> ${esc(r.basis||'—')}</p>
      <p class="text-xs text-navy-400 mt-1">${new Date(r.at).toLocaleString('vi-VN')}</p>
      ${ap?`<div class="mt-3 rounded-xl bg-navy-50 p-3 text-sm">${ap.by===role?`<b>Bạn đã gửi yêu cầu xem xét lại</b> (${new Date(ap.at).toLocaleString('vi-VN')}): ${esc(ap.text)}`:'Đã có yêu cầu xem xét lại từ bên còn lại.'}</div>`
        :`<div class="mt-3">${field('Bổ sung thông tin / khiếu nại lại',`<textarea id="ap-text" class="${inCls} min-h-[64px]" placeholder="Nêu thông tin bổ sung hoặc lý do bạn không đồng ý…"></textarea>`)}${btn('Gửi yêu cầu xem xét lại','data-act="partyAppeal" data-id="'+o.id+'"','ghost')}</div>`}`,'mb-4');
  }

  const stepperHtml=`<ol class="grid gap-5 mb-5">${stepLabels.map((l,i)=>{
    const done=idx>i, cur=idx===i, dis=o.status==='DISPUTED'||o.status==='REFUNDED'||o.status==='CANCELLED';
    const dot=dis?'bg-slate-300 text-slate-500':(done?'bg-mint-500 text-white':cur?'bg-amber-500 text-white':'bg-navy-100 text-navy-400');
    return `<li class="step-line flex gap-3"><span class="w-10 h-10 shrink-0 rounded-full grid place-items-center font-extrabold ${dot}">${done?'✓':i+1}</span>
      <div class="pt-1.5"><div class="font-bold ${cur&&!dis?'text-amber-700':''}">${l}</div>${cur&&!dis?'<div class="text-xs text-navy-400">Đang ở bước này</div>':''}</div></li>`;
  }).join('')}</ol>`;

  const inspectEnd=o.deliveredAt?o.deliveredAt+o.inspectionHours*3600*1000:null;

  let actions='';
  if(role==='buyer' && (o.status==='CREATED'||o.status==='WAITING_PAYMENT')){
    actions=`<div class="mt-4">${btn('Tiến hành thanh toán','data-go="payment" data-id="'+o.id+'"')}</div>`;
  }
  if(role==='buyer' && o.status==='DELIVERED'){
    actions=`<div class="grid sm:grid-cols-2 gap-2 mt-4">
      ${btn('✓ Xác nhận đã nhận vé đúng mô tả','data-act="confirmReceived" data-id="'+o.id+'"')}
      ${btn('Khiếu nại / Đóng băng giao dịch','data-act="openDispute" data-id="'+o.id+'"','danger')}</div>
      ${inspectEnd?`<p class="text-xs text-navy-400 mt-2">Hãy kiểm tra vé trong tài khoản/hệ thống chính thức. Nếu bạn không xác nhận hoặc khiếu nại, giao dịch tự hoàn tất sau <b id="autoTimer" class="mono"></b>.</p>`:''}`;
  }
  if(role==='seller' && o.status==='HOLDING_BY_PARTNER'){
    actions=`<div class="mt-4">${btn('Xác nhận đã giao vé','data-act="openDeliverForm" data-id="'+o.id+'"','navy')}</div>`;
  }
  if(role==='seller' && (o.status==='WAITING_PAYMENT'||o.status==='CREATED')){
    actions=`<p class="text-xs text-navy-400 mt-4">${o.buyerUserId?'Chờ người mua thanh toán để hệ thống kích hoạt bước giao vé.':'Chờ người mua nhập mã phòng và mật khẩu để tham gia.'}</p>`;
  }
  {
    const canComplain=(o.status==='HOLDING_BY_PARTNER'||o.status==='DELIVERED')&&!(role==='buyer'&&o.status==='DELIVERED');
    const canCancel=role==='seller'&&(o.status==='CREATED'||o.status==='WAITING_PAYMENT'||o.status==='HOLDING_BY_PARTNER');
    if(canComplain||canCancel){
      actions+=`<div class="flex gap-2 flex-wrap mt-3">${canComplain?btn('🚩 Báo vấn đề / Khiếu nại','data-act="openDispute" data-id="'+o.id+'"','danger'):''}${canCancel?btn('Gỡ tin / huỷ giao dịch','data-act="openCancel" data-id="'+o.id+'"','ghost'):''}</div>`;
    }
  }

  return `<button data-go="${role==='buyer'?'home':'sellerOrders'}" class="text-sm font-semibold text-navy-400 mb-3">← Danh sách phòng</button>
  <div class="flex items-start justify-between gap-3 flex-wrap mb-4">
    <div><h1 class="text-xl font-extrabold">${esc(o.itemName)} <span class="text-navy-300 font-medium">· ${esc(o.tier)} · ${o.qty} vé</span></h1>
      <p class="text-xs text-navy-400 mono mt-1">Mã phòng: ${esc(o.roomCode)} · ${esc(o.id)}</p></div>
    ${badge(o.status)}</div>
  <div class="grid lg:grid-cols-[1fr_320px] gap-5">
    <div>
      ${banner}
      ${complaintBlock}
      ${hearingBlock}
      ${adminBlock}
      ${resolutionBlock}
      ${card(stepperHtml+actions)}
      <div class="mt-4">${card(`
        <h3 class="font-extrabold mb-3">Trao đổi & bằng chứng</h3>
        <div id="chatlog" class="h-56 overflow-y-auto bg-navy-50 rounded-xl p-3 grid gap-2 mb-3">
          ${(o.messages||[]).map(m=>`<div class="max-w-[80%] ${m.from===role?'ml-auto bg-mint-500 text-white':'bg-white ring-1 ring-navy-100'} rounded-xl px-3 py-2 text-sm">${msgBody(m)}</div>`).join('')||'<p class="text-xs text-navy-300 text-center pt-16">Chưa có tin nhắn.</p>'}
        </div>
        ${o.evidences&&o.evidences.length?`<div class="flex flex-wrap gap-2 mb-3">${o.evidences.map(e=>`<span class="text-xs bg-navy-100 text-navy-600 rounded-lg px-2.5 py-1">📎 ${esc(e)}</span>`).join('')}</div>`:''}
        <div class="flex gap-2"><input id="chatin" class="${inCls}" placeholder="Nhắn tin…">
        <label class="rounded-xl ring-1 ring-navy-100 w-11 grid place-items-center cursor-pointer shrink-0" title="Đính kèm ảnh/video"><input type="file" id="chatfile2" accept="image/*" class="hidden" data-act="attach" data-id="${o.id}">📎</label>
        ${btn('Gửi','data-act="sendChat" data-id="'+o.id+'"')}</div>
      `)}</div>
    </div>
    <aside class="grid gap-4">${helpCard(o,role)}
      ${ticketInfoCard(o,role)}
      ${card(`<h3 class="font-extrabold mb-3">Tóm tắt thanh toán</h3>
        <div class="grid gap-1.5 text-sm">
          <div class="flex justify-between"><span class="text-navy-400">Giá trị đơn</span><b>${money(o.amount)}</b></div>
          <div class="flex justify-between"><span class="text-navy-400">Phí (${o.feePayer==='BUYER'?'người mua chịu':o.feePayer==='SELLER'?'người bán chịu':'chia đôi'})</span><b>${money(o.feeTotal)}</b></div>
          <div class="h-px bg-navy-100 my-1"></div>
          <div class="flex justify-between"><span class="font-bold">Người mua trả</span><b>${money(o.buyerTotal)}</b></div>
          <div class="flex justify-between"><span class="font-bold">Người bán nhận</span><b>${money(o.sellerReceive)}</b></div>
        </div>
        ${o.partnerTxId?`<p class="text-xs text-navy-300 mt-3 mono">Mã giao dịch đối tác: ${esc(o.partnerTxId)}</p>`:''}`)}
      ${role==='seller' && !o.buyerUserId ? card(`<h3 class="font-extrabold mb-2">Mời người mua</h3>
        <p class="text-xs text-navy-400 mb-3">Gửi riêng hai thông tin này cho người mua (Zalo, Messenger…).</p>
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-navy-50 rounded-xl p-2.5 text-center"><div class="text-[11px] text-navy-400 mb-0.5">Mã phòng</div><div class="font-mono font-extrabold">${esc(o.roomCode)}</div></div>
          <div class="bg-navy-50 rounded-xl p-2.5 text-center"><div class="text-[11px] text-navy-400 mb-0.5">Mật khẩu</div><div class="font-mono font-extrabold">${esc(o.roomPassword)}</div></div>
        </div>`) : ''}
      ${card(`<h3 class="font-extrabold mb-2">Thành viên phòng ${o.buyerUserId&&o.sellerUserId?'<span class="text-xs font-bold text-mint-700 bg-mint-100 rounded-full px-2 py-0.5 ml-1">🔒 2/2 · đã khoá</span>':'<span class="text-xs font-bold text-amber-700 bg-amber-100 rounded-full px-2 py-0.5 ml-1">1/2</span>'}</h3><p class="text-sm text-navy-400">Người mua: <b class="text-navy-800">${o.buyerName?esc(o.buyerName):'Chưa tham gia'}</b></p><p class="text-sm text-navy-400">Người bán: <b class="text-navy-800">${o.sellerName?esc(o.sellerName):'Chưa tham gia'}</b></p><p class="text-[11px] text-navy-300 mt-2">Mỗi phòng chỉ có 1 người mua và 1 người bán. Khi đủ 2 bên, phòng tự khoá: người thứ ba không vào được dù biết mã và mật khẩu. Sai mật khẩu 5 lần, phòng tạm khoá 5 phút.</p>`)}
    </aside>
  </div>`;
}

/* ================= SCREENS: SELLER ================= */
function sellerHome(){ return sellerOrders(); }
function sellerOrders(){
  const list=myOrders('seller');
  return `<div class="flex items-center justify-between flex-wrap gap-3 mb-5">
    <div><h1 class="text-2xl font-extrabold">Đơn bán của bạn</h1><p class="text-navy-400 text-sm">Theo dõi trạng thái giữ tiền và giao vé cho từng đơn.</p></div>
    <div class="flex gap-2">${btn('Cài đặt nhận tiền','data-go="payout"','ghost')}${btn('+ Tạo phòng mới','data-go="create"')}</div></div>
  <div class="grid gap-3">${list.length?list.map(o=>roomSummaryRow(o,'seller')).join(''):emptyState('Bạn chưa có đơn bán nào. Bấm "+ Tạo phòng mới" để đăng vé và nhận mã mời người mua.')}</div>`;
}
function sellerPayout(){
  const p=mySellerPayout||{};
  return `<button data-go="sellerOrders" class="text-sm font-semibold text-navy-400 mb-3">← Đơn bán</button>
  <h1 class="text-2xl font-extrabold mb-1">Cài đặt tài khoản nhận tiền</h1>
  <p class="text-navy-400 text-sm mb-5">Thông tin này chỉ mình bạn thấy được, dùng để cổng thanh toán đối tác giải ngân tự động khi giao dịch hoàn tất.</p>
  <div class="max-w-lg">${card(`
    ${trustBank()}${field('Ngân hàng / Ví điện tử',`<select id="p-bank" class="${inCls}"><option ${p.bank==='MoMo'?'selected':''}>MoMo</option><option ${p.bank==='Vietcombank'?'selected':''}>Vietcombank</option><option ${p.bank==='ACB'?'selected':''}>ACB</option><option ${p.bank==='Techcombank'?'selected':''}>Techcombank</option></select>`)}
    ${field('Số tài khoản / số điện thoại ví',`<input id="p-no" class="${inCls}" value="${esc(p.no||'')}">`)}
    <div class="flex gap-2 items-end mb-4">
      <div class="flex-1">${field('Tên chủ tài khoản',`<input id="p-name" class="${inCls}" value="${esc(p.name||'')}" placeholder="Bấm kiểm tra để tự điền">`)}</div>
      ${btn('Kiểm tra tên','data-act="checkAccName"','navy')}
    </div>
    ${p.verified?`<p class="text-sm text-mint-700 font-semibold mb-3">✓ Đã xác minh chủ tài khoản: ${esc(p.name)}</p>`:''}
    ${btn('Lưu thông tin nhận tiền','data-act="savePayout"')}
  `)}</div>`;
}
function openDeliverModal(id){
  const o=orderOf(id);
  openModal(`<form id="deliverForm" class="p-6">
    <h3 class="font-extrabold text-lg mb-1">Xác nhận đã giao vé</h3>
    <p class="text-sm text-navy-400 mb-4">${esc(o.itemName)} · ${esc(o.tier)}</p>
    <p class="text-xs bg-navy-50 rounded-xl p-3 mb-4 text-navy-600">Hãy chuyển nhượng/tặng vé trên hệ thống chính thức của nhà phát hành (nếu có) và làm theo hướng dẫn để người mua nhận vé, rồi xác nhận tại đây. Không gửi mật khẩu hay mã OTP của bất kỳ tài khoản nào.</p>

function riskFlags(o){
  const flags=[]; const bh=o.buyerAcctHash, sh=o.sellerAcctHash;
  if(bh&&sh&&bh===sh) flags.push({lv:'high',t:'Người mua và người bán dùng cùng một tài khoản ngân hàng.'});
  const usersOf=hh=>{ const s=new Set(); orders.forEach(x=>{ if(x.buyerAcctHash===hh&&x.buyerUserId) s.add(x.buyerUserId); if(x.sellerAcctHash===hh&&x.sellerUserId) s.add(x.sellerUserId); }); return s; };
  [['người mua',bh,o.buyerAcctMasked],['người bán',sh,o.sellerAcctMasked]].forEach(([who,hh,m])=>{
    if(!hh) return;
    const n=usersOf(hh).size;
    if(n>1) flags.push({lv:'high',t:`Tài khoản ${m} của ${who} được ${n} tài khoản người dùng khác nhau sử dụng.`});
    const recent=orders.filter(x=>(x.buyerAcctHash===hh||x.sellerAcctHash===hh)&&(Date.now()-(x.createdAt||0))<24*3600e3).length;
    if(recent>=3) flags.push({lv:'warn',t:`Tài khoản ${m} của ${who} xuất hiện trong ${recent} giao dịch trong 24 giờ qua.`});
    if(orders.some(x=>x.buyerAcctHash===hh)&&orders.some(x=>x.sellerAcctHash===hh)) flags.push({lv:'warn',t:`Tài khoản ${m} của ${who} từng là cả bên mua lẫn bên bán (tiền vào và ra cùng một tài khoản).`});
  });
  if(o.buyerAcctName&&o.sellerAcctName&&o.buyerAcctName===o.sellerAcctName&&bh!==sh) flags.push({lv:'warn',t:'Hai bên có cùng tên chủ tài khoản nhưng khác số tài khoản.'});
  return flags;
}

const SUBNAV={
  buyer:[['home','Phòng của tôi']],
  seller:[['sellerOrders','Đơn bán'],['create','Tạo phòng mới'],['payout','Cài đặt nhận tiền']],
  admin:[['overview','Tổng quan'],['transactions','Giao dịch'],['disputes','Tranh chấp'],['settings','Cấu hình']]
};
const state={ role:null, screen:'roleGate', orderId:null, create:{}, err:'',
  buyerOnboarded:false, sellerOnboarded:false, adminUnlocked:false,
  buyerDisplayName:'', buyerPhone:'', sellerDisplayName:'', sellerPhone:'' };

function render(){
  if(!booted){
    $('#roleTabsWrap').style.visibility='hidden'; $('#subnav').innerHTML='';
    $('#app').innerHTML='<div class="min-h-[60vh] grid place-items-center text-navy-400 text-sm">Đang kết nối dữ liệu…</div>';
    return;
  }
  if(state.screen==='terms'){ $('#roleTabsWrap').style.visibility=state.role?'visible':'hidden'; $('#app').innerHTML='<div class="fade">'+termsPage()+'</div>'; return; }
  if(!state.role){
    $('#roleTabsWrap').style.visibility='hidden';
    $('#subnav').innerHTML='';
    $('#app').innerHTML=`<div class="fade">${roleGate()}</div>`;
    return;
  }
  $('#roleTabsWrap').style.visibility='visible';
  if(state.adminUnlocked && !$('#roleTabsWrap [data-role="admin"]')){
    const b=document.createElement('button');
    b.dataset.role='admin'; b.className='rtab px-3 py-1.5 rounded-lg transition'; b.textContent='Quản trị';
    $('#roleTabsWrap').appendChild(b);
  }
  $all('.rtab').forEach(b=>{
    const on=b.dataset.role===state.role;
    b.className='rtab px-3 py-1.5 rounded-lg transition '+(on?'bg-mint-500 text-navy-900 font-extrabold':'text-navy-200 hover:text-white');
  });
  const nav=SUBNAV[state.role]||[];
  $('#subnav').innerHTML=nav.map(([k,l])=>`<button data-go="${k}" class="px-3 py-1.5 rounded-lg font-semibold ${state.screen===k?'bg-white/10 text-white':'text-navy-300 hover:text-white'}">${l}</button>`).join('');

  let html='';
  if(state.role==='buyer'){
    if(state.screen==='onboardBuyer') html=onboardBuyer();
    else if(state.screen==='payment') html=buyerPayment();
    else if(state.screen==='room') html=buyerRoom();
    else { state.screen='home'; html=buyerHome(); }
  } else if(state.role==='seller'){
    if(state.screen==='onboardSeller') html=onboardSeller();
    else if(state.screen==='create') html=sellerCreate();
    else if(state.screen==='shareRoom') html=shareRoom();
    else if(state.screen==='payout') html=sellerPayout();
    else if(state.screen==='room') html=roomScreen('seller');
    else { state.screen='sellerOrders'; html=sellerOrders(); }
  } else {
    if(state.screen==='transactions') html=adminTransactions();
    else if(state.screen==='transactionDetail') html=transactionDetail();
    else if(state.screen==='disputes') html=adminDisputes();
    else if(state.screen==='settings') html=adminSettings();
    else { state.screen='overview'; html=adminOverview(); }
  }
  $('#app').innerHTML=`<div class="fade">${html}</div>`;
  renderGen++; startTimers(renderGen);
}
let renderGen=0;
function startTimers(gen){
  const myGen = gen===undefined ? renderGen : gen;
  const cd=$('#countdown');
  if(cd){ const o=orderOf(state.orderId);
    const tick=()=>{ if(myGen!==renderGen) return; const rem=o.paymentDeadline-Date.now();
      if(rem<=0){ cd.textContent='Hết hạn'; return; }
      cd.textContent=pad(Math.floor(rem/60000))+':'+pad(Math.floor(rem/1000)%60); setTimeout(tick,1000); };
    tick();
  }
  const at=$('#autoTimer');
  if(at){ const o=orderOf(state.orderId); const end=o.deliveredAt+o.inspectionHours*3600*1000;
    const tick=()=>{ if(myGen!==renderGen) return; const rem=end-Date.now(); if(rem<=0){ at.textContent='00:00:00'; if(autoCompleteIfDue(o)) render(); return;}
      const h=Math.floor(rem/3600000),m=Math.floor(rem/60000)%60,s=Math.floor(rem/1000)%60;
      at.textContent=pad(h)+':'+pad(m)+':'+pad(s); setTimeout(tick,1000); };
    tick();
  }
  const ht=$('#hearingTimer');
  if(ht){ const o=orderOf(state.orderId);
    if(o && o.hearing && !o.hearing.verdict){
      const tick=()=>{ if(myGen!==renderGen) return;
        const rem=o.hearing.deadlineAt-Date.now();
        if(rem<=0){ ht.textContent='Đã hết giờ'; maybeAutoResolve(o); return; }
        ht.textContent=pad(Math.floor(rem/60000))+':'+pad(Math.floor(rem/1000)%60); setTimeout(tick,1000); };
      tick();
    }
  }
}

function go(screen,ds){
  state.err='';

  if(screen==='terms'&&state.screen!=='terms') state.prevScreen=state.screen;
  if(ds&&ds.id) state.orderId=ds.id;
  state.screen=screen;
  window.scrollTo(0,0); render();
}

    const notes=$('#pf-notes').value.trim(); const o=orderOf(id);
    o.platformCheckNotes=notes; o.platformCheckAt=Date.now();
    persistOrder(o,{platformCheckNotes:notes,platformCheckAt:o.platformCheckAt});
    toast('Đã lưu ghi chú xác minh'); return;
  }
  if(act==='settleBuyerWin'||act==='settleSellerWin'){
    const basis=(($('#verdict-basis')||{}).value||'').trim();
    if(!basis){ toast('Nhập căn cứ & hướng xử lý trước khi chốt','err'); return; }
    settleDispute(orderOf(id),act==='settleBuyerWin'?'buyer':'seller','admin_decision',basis); go('transactionDetail',{id}); return;
  }
  if(act==='forceNoShow'){
    const o=orderOf(id); if(!o||!o.hearing) return;
    const winner = o.hearing.buyerJoined?'buyer':(o.hearing.sellerJoined?'seller':null);
    if(!winner){ toast('Không xác định được bên vắng mặt','err'); return; }
    settleDispute(o,winner,'no_show',winner==='buyer'?'Người bán không tham gia phiên đối chất đúng hạn nên người mua được xử thắng.':'Người mua không tham gia phiên đối chất đúng hạn nên người bán được xử thắng.'); go('transactionDetail',{id}); return;
  }
  if(act==='ruleSplit'){
    openModal(`<div class="p-6"><h3 class="font-extrabold text-lg mb-3">Chia tỷ lệ hoàn/giải ngân</h3>
      <label class="text-sm font-semibold">% hoàn cho người mua</label>
      <input id="splitpct" type="range" min="0" max="100" value="50" class="w-full mb-1">
      <div class="text-center font-extrabold text-lg mb-4"><span id="splitval">50</span>% người mua · <span id="splitval2">50</span>% người bán</div>
      <textarea id="split-basis" class="${inCls} min-h-[64px] mb-4" placeholder="Căn cứ & hướng xử lý (gửi cho hai bên)"></textarea>
      <div class="flex gap-2 justify-end">${btn('Huỷ','data-act="closeModal"','ghost')}${btn('Xác nhận phán quyết','data-act="confirmSplit" data-id="'+id+'"','navy')}</div></div>`);
    const r=$('#splitpct'); r.addEventListener('input',()=>{$('#splitval').textContent=r.value;$('#splitval2').textContent=100-r.value});
    return;
  }
  if(act==='confirmSplit'){
    const basis=(($('#split-basis')||{}).value||'').trim(); if(!basis){ toast('Nhập căn cứ & hướng xử lý','err'); return; }
    const pct=+$('#splitpct').value; const o=orderOf(id); o.status='REFUNDED'; o.refundedAt=Date.now();
    o.resolution={winner:'split',reason:'admin_split',basis,at:Date.now(),pct};
    const patch={status:o.status,refundedAt:o.refundedAt,resolution:o.resolution};
    if(o.hearing){ const vAt=Date.now(); o.hearing.verdict='split'; o.hearing.verdictReason='admin_split'; o.hearing.verdictAt=vAt;
      patch['hearing.verdict']='split'; patch['hearing.verdictReason']='admin_split'; patch['hearing.verdictAt']=vAt; }
    persistOrder(o,patch);
    const refundAmt=Math.round(o.buyerTotal*pct/100), payoutAmt=o.sellerReceive-Math.round(o.sellerReceive*pct/100);
    logEvent(o.id,'MOMO','REFUND','SUCCESS',{amount:refundAmt,idk:'IDK-'+rid(),acct:o.buyerAcctMasked?('Đến '+o.buyerAcctMasked):undefined});
    logEvent(o.id,'MOMO','PAYOUT','SUCCESS',{amount:payoutAmt,idk:'IDK-'+rid(),acct:o.sellerAcctMasked?('Đến '+o.sellerAcctMasked):undefined});
    closeModal(); toast(`Đã chia ${pct}% hoàn người mua / ${100-pct}% giải ngân người bán`); go('transactionDetail',{id}); return;
  }
  if(act==='saveSettings'){
    settings.feePercent=+$('#st-fee').value; settings.fixedFee=+$('#st-fixed').value;
    settings.partnerFeePercent=+$('#st-partner').value; settings.ackDays=($('#st-ack').value||'').trim(); settings.reviewHours=+$('#st-review').value||2;
    toast('Đã lưu cấu hình hệ thống'); return;
  }

  if(act==='submitBuyerOnboard'){
    const name=$('#ob-name').value.trim(), phone=$('#ob-phone').value.trim();
    const bank=$('#ob-bank').value, no=$('#ob-no').value.trim(), accname=$('#ob-accname').value.trim();
    const code=$('#ob-code').value.trim(), pass=$('#ob-pass').value.trim();
    state.buyerDisplayName=name; state.buyerPhone=phone; state.obCode=code;
    if(!$('#ob-terms').checked){ state.err='Bạn cần đồng ý Điều khoản sử dụng & Quy chế hoạt động.'; render(); return; } if(!name||!phone||!no||!accname||!code||!pass){ state.err='Vui lòng điền đủ tên, SĐT, tài khoản ngân hàng (và bấm "Kiểm tra tên"), mã phòng và mật khẩu.'; render(); return; }
    const bankObj={bank,no,name:accname,verified:true,phone}; bankObj.hash=await hashAcct(bank,no);
    myBuyerBank=bankObj;
    const r=joinRoom(code,pass,'buyer',name);
    if(!r.ok){ state.err=r.msg; render(); return; }
    persistBuyerBank(bankObj);
    state.err=''; state.buyerOnboarded=true;
    toast('Đã vào phòng giao dịch'); go('room',{id:r.order.id}); return;
  }
  if(act==='submitSellerOnboard'){
    const name=$('#os-name').value.trim(), phone=$('#os-phone').value.trim(), bank=$('#os-bank').value, no=$('#os-no').value.trim(), accname=$('#os-accname').value.trim();
    state.sellerDisplayName=name; state.sellerPhone=phone;
    if(!$('#os-terms').checked){ state.err='Bạn cần đồng ý Điều khoản sử dụng & Quy chế hoạt động.'; render(); return; } if(!name||!phone||!no||!accname){ state.err='Vui lòng điền tên, số điện thoại, số tài khoản và bấm "Kiểm tra tên" để xác minh chủ tài khoản.'; render(); return; }
    state.err='';
    const payout={bank,no,name:accname,verified:true,phone}; payout.hash=await hashAcct(bank,no); mySellerPayout=payout; persistPayout(payout);
    state.sellerOnboarded=true;
    toast('Thiết lập xong — giờ hãy tạo phòng đăng vé'); go('create'); return;
  }
  if(act==='submitCreate'){
    const d=state.create;
    d.itemName=$('#f-item').value.trim(); d.tier=$('#f-tier').value.trim(); d.qty=+$('#f-qty').value||1;
    d.description=$('#f-desc').value.trim(); d.amount=+$('#f-amount').value||0; d.inspectionHours=+$('#f-insp').value;
    d.feePayer=d.feePayer||'BUYER'; d.password=$('#f-pass').value.trim();
    d.eventAt=$('#f-eventat').value; d.issuer=$('#f-issuer').value.trim(); d.restrictions=$('#f-restrict').value.trim(); d.elig=$('#f-elig').checked;
    if(!d.itemName||!d.tier||!d.amount){ state.err='Vui lòng điền tên show, hạng vé và giá bán.'; render(); return; }
    if(!d.password){ state.err='Vui lòng đặt mật khẩu phòng để chia sẻ riêng cho người mua.'; render(); return; }
    if(!d.eventAt){ state.err='Vui lòng nhập ngày giờ diễn ra sự kiện.'; render(); return; }
    if(new Date(d.eventAt).getTime()<=Date.now()){ state.err='Sự kiện đã diễn ra hoặc thời gian không hợp lệ — không thể đăng vé.'; render(); return; }
    d.restrictions=d.restrictions||'Không có'; if(!d.issuer){ state.err='Vui lòng điền nơi phát hành vé (VD: Ticketbox).'; render(); return; }
    if(!d.elig){ state.err='Bạn cần xác nhận đã kiểm tra điều kiện chuyển giao của vé trước khi đăng.'; render(); return; }
    if(!myId){ state.err='Chưa kết nối được tài khoản Firebase — tải lại trang rồi thử lại.'; render(); return; }
    if(!mySellerPayout){ state.err='Bạn chưa đăng ký tài khoản ngân hàng nhận tiền — vào "Cài đặt nhận tiền" trước.'; render(); return; }
    if(!mySellerPayout.hash){ mySellerPayout.hash=await hashAcct(mySellerPayout.bank,mySellerPayout.no); persistPayout(mySellerPayout); }
    if(!mySellerPayout.phone) mySellerPayout.phone=state.sellerPhone||'';
    const o=buildOrder({itemName:d.itemName,tier:d.tier,qty:d.qty,description:d.description,amount:d.amount,feePayer:d.feePayer,inspectionHours:d.inspectionHours,status:'CREATED',roomPassword:d.password,eventAt:new Date(d.eventAt).getTime(),issuer:d.issuer,transferRestrictions:d.restrictions,eligibilityConfirmedAt:Date.now(),sellerUserId:myId,sellerName:state.sellerDisplayName,...acctFields('seller',mySellerPayout)});
    orders.unshift(o); o.review=autoReview(o); persistNewOrder(o);
    state.create={}; toast('Đã tạo phòng đăng vé'); go('shareRoom',{id:o.id}); return;
  }
});
document.addEventListener('submit',e=>{
  if(e.target.id==='deliverForm'){
    e.preventDefault();
    const id=e.target.querySelector('[type=submit]').dataset.id; const o=orderOf(id);
    const code=$('#dv-code').value.trim(); const f=$('#dv-file').files[0];
    o.status='DELIVERED'; o.deliveredAt=Date.now(); o.deliveryCode=code;
    o.evidences=o.evidences||[]; o.evidences.push(f?f.name:'xac-nhan-giao-ve.jpg');
    persistOrder(o,{status:o.status,deliveredAt:o.deliveredAt,deliveryCode:o.deliveryCode,evidences:o.evidences});
    closeModal(); toast('Đã xác nhận giao vé — đếm ngược thời gian kiểm hàng bắt đầu'); go('room',{id}); return;
  }
  if(e.target.id==='disputeForm'){
    e.preventDefault();
    const id=e.target.querySelector('[type=submit]').dataset.id; const o=orderOf(id);
    const reason=$('#dp-reason').value.trim(); if(!reason){ toast('Nhập mô tả vấn đề','err'); return; }
    const f=$('#dp-file').files[0];
    const by=state.role==='seller'?'seller':'buyer'; const occ=$('#dp-when').value;
    o.status='DISPUTED'; o.disputeReason=reason; o.disputeEvidence=[f?f.name:'(chưa đính kèm)']; o.disputeBy=by;
    o.complaint={id:'KN-'+rid(),category:$('#dp-cat').value,by,occurredAt:occ?new Date(occ).getTime():null,contact:$('#dp-contact').value.trim(),createdAt:Date.now(),ackAt:null};
    persistOrder(o,{status:o.status,disputeReason:o.disputeReason,disputeEvidence:o.disputeEvidence,disputeBy:by,complaint:o.complaint});
    closeModal(); toast('Đã gửi khiếu nại — giao dịch tạm khoá chờ Quản trị viên','warn'); go('room',{id}); return;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id==='chatfile2'){
    const id=e.target.dataset.id, f=e.target.files[0]; if(!f) return;
    if(!f.type.startsWith('image/')){ toast('Hiện chỉ hỗ trợ gửi ảnh (JPG/PNG)','err'); return; }
    compressImg(f).then(img=>{ const o=orderOf(id), role=state.role==='buyer'?'buyer':'seller';
      if(JSON.stringify(o.messages||[]).length+img.length>850000){ toast('Cuộc trò chuyện đã đầy dung lượng ảnh','err'); return; }
      (o.messages=o.messages||[]).push({from:role,text:'',img,ts:Date.now()}); persistOrder(o,{messages:o.messages}); render(); toast('Đã gửi ảnh'); }).catch(()=>toast('Không đọc được ảnh','err'));
  }
  if(e.target.name==='feePayer'){ state.create.feePayer=e.target.value; render(); }
  if(e.target.id==='f-elig'){ state.create.elig=e.target.checked; }
});
document.addEventListener('input',e=>{
  if(!state.create) return;
  const map={'f-item':'itemName','f-tier':'tier','f-qty':'qty','f-desc':'description','f-amount':'amount','f-pass':'password','f-eventat':'eventAt','f-issuer':'issuer','f-restrict':'restrictions'};
  const key=map[e.target.id]; if(!key) return;
  state.create[key]=(e.target.id==='f-amount'||e.target.id==='f-qty')?(+e.target.value||0):e.target.value;
  if(e.target.id==='f-amount'){
    const feePayer=state.create.feePayer||'BUYER', f=computeFees(state.create.amount,feePayer);
    if($('#prv-amount')) $('#prv-amount').textContent=money(state.create.amount);
    if($('#prv-platform')) $('#prv-platform').textContent=money(f.platformFee);
    if($('#prv-partner')) $('#prv-partner').textContent=money(f.partnerFee);
    if($('#prv-total')) $('#prv-total').textContent=money(f.buyerTotal);
    if($('#prv-receive')) $('#prv-receive').textContent=money(f.sellerReceive);
  }
});

render();
boot();
</script>
</body>
</html>
